name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: racestreak_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d racestreak_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_NAME: RaceStreak
      APP_VERSION: 0.1.0
      APP_ENV: testing
      APP_KEY: base64:cmFjZXN0cmVhay1sb2NhbC1kZXZlbG9wbWVudC1rZXk=
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      APP_TIMEZONE: UTC
      LOG_CHANNEL: "null"
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: racestreak_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: intl, mbstring, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Find Composer cache directory
        id: composer-cache
        working-directory: backend
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restore Composer download cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check backend formatting and static analysis
        working-directory: backend
        run: composer quality

      - name: Run backend tests
        working-directory: backend
        run: composer test

      - name: Validate PostgreSQL migrations
        working-directory: backend
        run: |
          php artisan db:check
          php artisan migrate:fresh --force
          php artisan migrate:rollback --force
          php artisan migrate --force

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check frontend formatting, linting and types
        working-directory: frontend
        run: npm run quality

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build production frontend
        working-directory: frontend
        run: npm run build
