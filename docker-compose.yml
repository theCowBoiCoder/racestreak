services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: racestreak
      POSTGRES_USER: racestreak
      POSTGRES_PASSWORD: ${DB_PASSWORD:-racestreak-local}
    ports:
      - "${DB_PORT_FORWARD:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U racestreak -d racestreak"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_NAME: RaceStreak
      APP_VERSION: 0.1.0
      APP_ENV: local
      APP_KEY: base64:cmFjZXN0cmVhay1sb2NhbC1kZXZlbG9wbWVudC1rZXk=
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      APP_TIMEZONE: UTC
      LOG_CHANNEL: stderr
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: racestreak
      DB_USERNAME: racestreak
      DB_PASSWORD: ${DB_PASSWORD:-racestreak-local}
    command: ["sh", "-lc", "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"]
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/api/v1/health') === false ? 1 : 0);"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      NUXT_BACKEND_BASE: http://backend:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
